name: 'Terraform'

on:
  push:
    branches: [ "main", "dev", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend=false
      working-directory: terraform

    - name: Terraform Format
      run: terraform fmt -check
      working-directory: terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: terraform

    # The readiness gate is a Python script run by a local-exec
    # provisioner, so `terraform validate` cannot see inside it. Compile
    # it here - a syntax error would otherwise first surface mid-deploy,
    # after a VM has already been built and paid for.
    - name: Check readiness script
      run: python3 -m py_compile wait_for_bootstrap.py
      working-directory: terraform

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Init TFLint
      run: tflint --init
      working-directory: terraform

    - name: Run TFLint
      run: tflint --recursive
      working-directory: terraform

    # Trivy, not tfsec: tfsec is end-of-life and its checks were folded
    # into Trivy, which is also what the deployment repo scans with.
    #
    # Downloaded as a pinned release asset and checksum-verified, rather
    # than piping install.sh from the main branch. Pinning keeps the check
    # reproducible instead of tracking latest, and a release asset is not
    # subject to the GitHub API rate limits that made the old tfsec action
    # unusable from hosted runners. Bump VERSION and SHA256 together; the
    # hash is the one in that release's trivy_<version>_checksums.txt.
    #
    # No --severity filter, deliberately. tfsec failed the build on any
    # finding, and the check that matters most here - OPNSTK-0003, public
    # ingress on a security group - is MEDIUM. Filtering to HIGH,CRITICAL
    # would quietly stop this repo being scanned for the one thing it most
    # needs scanning for.
    - name: Run Trivy (IaC)
      env:
        TRIVY_VERSION: '0.74.0'
        TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
      run: |
        set -euo pipefail
        curl -sSLf -o /tmp/trivy.tar.gz           "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "$TRIVY_SHA256  /tmp/trivy.tar.gz" | sha256sum -c -
        tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
        /tmp/trivy config --exit-code 1 terraform
