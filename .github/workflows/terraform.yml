name: 'Terraform'

on:
  push:
    branches: [ "main", "dev", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init -backend=false
      working-directory: terraform

    - name: Terraform Format
      run: terraform fmt -check
      working-directory: terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: terraform

    - name: Setup TFLint
      uses: terraform-linters/setup-tflint@v4
      with:
        tflint_version: latest

    - name: Init TFLint
      run: tflint --init
      working-directory: terraform

    - name: Run TFLint
      run: tflint --recursive
      working-directory: terraform

    # Installed directly rather than via aquasecurity/tfsec-action.
    # That action resolves the release through the GitHub API, which
    # fails from hosted runners either way: unauthenticated it hits the
    # shared IP rate limit (403, intermittently), and authenticated it
    # hits the aquasecurity org's IP allow list (403, every time). A
    # release asset download is not subject to either, and pinning the
    # version makes the check reproducible instead of tracking latest.
    - name: Run tfsec
      run: |
        set -euo pipefail
        curl -sSLf -o /tmp/tfsec           https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64
        chmod +x /tmp/tfsec
        /tmp/tfsec terraform
