# Packer checks for the Windows desktop image.
#
# Only `init` and `fmt -check` run here: `packer validate` needs a
# clouds.yaml to load the OpenStack builder config, and CI has no
# OpenStack credentials. Validation happens on the AppStore worker,
# which writes a per-task clouds.yaml before building.

name: 'Packer'

on:
  push:
    branches: [ "main", "dev", "feat/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev" ]
  release:
    types: [created]

permissions:
  contents: read

jobs:
  packer:
    name: 'Packer'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup `packer` (local action)
      uses: ./.github/actions
      with:
        version: '1.11.2'

    - name: Packer Init
      run: packer init packer
      env:
        # Unauthenticated plugin downloads share one IP-based GitHub rate
        # limit across all runners, which fails this step at random with
        # "Plugin host rate limited the plugin getter". The default token
        # is enough to get a per-repo limit.
        PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Packer Format
      run: packer fmt -check packer
